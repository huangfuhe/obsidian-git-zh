name: Release plugin

on:
    push:
        tags:
            - "v*"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      main.js
                      manifest.json
                      styles.css
